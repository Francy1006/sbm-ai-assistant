services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env.dev
    environment:
      APP_ENV: ${APP_ENV:-development}
    command: >-
      sh -c 'if [ "$${APP_ENV}" = "development" ]; then
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload;
      else exec uvicorn app.main:app --host 0.0.0.0 --port 8000; fi'
    volumes:
      - ./backend:/app
      - ../../context:/suite/context
      - ../../dp/DP-API:/suite/dp/DP-API
      - ../SBM-API:/suite/sbm/SBM-API
      - ../SBM-MANAGER:/suite/sbm/SBM-MANAGER
      - .:/suite/sbm/sbm-ai-assistant
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data: